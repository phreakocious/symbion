# The suite, run from the unpacked sdist so it tests what the release
# ships, on every push and pull request, and as the gate `release.yml` passes
# before it publishes. A private repo skips it: there macOS minutes are billed.
name: test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      # The core must run without the [gui] extra.
      - name: wheel smoke, no extras
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/symbion -V
          /tmp/bare/bin/symbion --help
      - name: suite from the unpacked sdist
        run: |
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components 1
          cd sdist
          python -m pip install '.[test,gui]'
          python -m pytest -q
